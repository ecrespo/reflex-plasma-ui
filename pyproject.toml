[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "reflex-plasma-ui"
version = "0.1.0"
description = "Plasma UI for Reflex: liquid WebGL panels that fuse on contact, refract what is behind them and snap to a grid."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
authors = [{ name = "Ernesto Crespo", email = "ecrespo@gmail.com" }]
keywords = ["reflex", "reflex-custom-components", "plasma-ui", "webgl", "liquid-glass", "panels"]

dependencies = ["reflex>=0.9.12"]

classifiers = [
    "Development Status :: 4 - Beta",
    "Framework :: Reflex",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: User Interfaces",
    "Typing :: Typed",
]

[project.urls]
Homepage = "https://github.com/ecrespo/reflex-plasma-ui"
Source = "https://github.com/ecrespo/reflex-plasma-ui"
Issues = "https://github.com/ecrespo/reflex-plasma-ui/issues"
Changelog = "https://github.com/ecrespo/reflex-plasma-ui/blob/main/CHANGELOG.md"
"Plasma UI" = "https://github.com/CruxGarden/plasma-ui"

[project.optional-dependencies]
dev = [
    "build>=1.2",
    "twine>=5.1",
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.14",
    "mypy>=1.11",
    "bandit[toml]>=1.7",
    "pip-audit>=2.7",
    # tomllib is stdlib from 3.11; the tests read pyproject.toml on 3.10 too.
    'tomli>=2.0; python_version < "3.11"',
]

[tool.setuptools.packages.find]
where = ["custom_components"]

[tool.setuptools.package-data]
reflex_plasma_ui = ["py.typed", "*.pyi"]

# ---------------------------------------------------------------------------
# Lint / format
# ---------------------------------------------------------------------------
[tool.ruff]
line-length = 120
target-version = "py310"
extend-exclude = ["plasma_ui_demo/.web", "plasma_ui_demo/.states"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "B",    # flake8-bugbear
    "C4",   # flake8-comprehensions
    "UP",   # pyupgrade
    "S",    # flake8-bandit
    "RUF",  # ruff-specific
    "D",    # pydocstyle
]
ignore = [
    "D203",  # conflicts with D211
    "D213",  # conflicts with D212
    "E501",  # line length is handled by the formatter
]

[tool.ruff.lint.isort]
known-first-party = ["reflex_plasma_ui", "plasma_ui_demo"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
# Stubs are generated by reflex's pyi_generator; do not lint their style.
"*.pyi" = ["D", "E", "W", "F", "I", "UP", "RUF"]
# Tests assert, and a reflex State's vars are mutable class attributes by design.
"tests/*" = ["S101", "D100", "D103", "D104", "RUF012"]
# The demo is example code: reflex State vars are mutable class attributes and
# keyword bundles read better as dict(...) calls than as literals.
"plasma_ui_demo/*" = ["D", "S101", "RUF012", "C408"]
# Preset bundles are keyword-argument sets; dict(...) reads as the call they feed.
"custom_components/reflex_plasma_ui/presets.py" = ["C408"]

# ---------------------------------------------------------------------------
# Types
# ---------------------------------------------------------------------------
[tool.mypy]
python_version = "3.10"
files = ["custom_components/reflex_plasma_ui"]
ignore_missing_imports = true
follow_imports = "silent"
warn_unused_ignores = true
warn_redundant_casts = true
no_implicit_optional = true
exclude = ['\.pyi$']

# Reflex declares event triggers as ``rx.EventHandler[some_spec_function]`` and
# lets ``add_imports`` return plain lists of names. Both are the framework's
# documented idiom and both are unrepresentable in mypy's type system, so the
# component module opts out of exactly those two diagnostics - nothing else.
[[tool.mypy.overrides]]
module = "reflex_plasma_ui.plasma_ui"
disable_error_code = ["type-arg", "valid-type", "dict-item"]


# ---------------------------------------------------------------------------
# Tests
# ---------------------------------------------------------------------------
[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
addopts = "-ra --strict-markers"

[tool.coverage.run]
source = ["reflex_plasma_ui"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = true

# ---------------------------------------------------------------------------
# Security (bandit)
# ---------------------------------------------------------------------------
[tool.bandit]
exclude_dirs = ["tests", "plasma_ui_demo/.web", "plasma_ui_demo/.states", ".venv", "dist", "build"]
