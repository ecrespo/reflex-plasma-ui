name: quality

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true

env:
  FORCE_COLOR: "1"
  TELEMETRY_ENABLED: "false"

jobs:
  lint:
    name: ruff
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: Install
        run: uv pip install --system -e ".[dev]"
      - name: Lint
        run: ruff check --output-format=github custom_components tests plasma_ui_demo/plasma_ui_demo

  typecheck:
    name: mypy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: Install
        run: uv pip install --system -e ".[dev]"
      - name: Type check
        run: mypy

  test:
    name: pytest (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: Set up Python
        run: uv python install ${{ matrix.python-version }}
      - name: Install
        run: uv pip install --system --python ${{ matrix.python-version }} -e ".[dev]"
      - name: Test
        run: pytest --cov=reflex_plasma_ui --cov-report=term-missing --cov-report=xml
      - name: Upload coverage
        if: matrix.python-version == '3.12'
        uses: actions/upload-artifact@v4
        with:
          name: coverage-xml
          path: coverage.xml
          if-no-files-found: error

  build:
    name: build & verify the distribution
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: Install
        run: uv pip install --system -e ".[dev]"
      - name: Build sdist and wheel
        run: python -m build
      - name: Check the rendered PyPI metadata
        run: twine check --strict dist/*
      - name: The wheel must ship the type marker and the stubs
        run: |
          python - <<'PY'
          import glob, sys, zipfile
          names = zipfile.ZipFile(sorted(glob.glob("dist/*.whl"))[-1]).namelist()
          required = {
              "reflex_plasma_ui/py.typed",
              "reflex_plasma_ui/plasma_ui.pyi",
              "reflex_plasma_ui/presets.py",
              "reflex_plasma_ui/runtime.py",
              "reflex_plasma_ui/_js.py",
          }
          missing = sorted(required - set(names))
          if missing:
              sys.exit(f"the wheel is missing: {missing}")
          print("wheel contents OK")
          PY
      - name: Install the built wheel into a clean environment and import it
        run: |
          uv venv /tmp/fresh
          uv pip install --python /tmp/fresh/bin/python dist/*.whl
          /tmp/fresh/bin/python -c "import reflex_plasma_ui as m; print(m.__version__); m.plasma_provider(m.plasma())"
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          if-no-files-found: error
