version: 2
updates:
  - package-ecosystem: github-actions
    directory: "/"
    target-branch: develop
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    labels: [dependencies, ci]

  - package-ecosystem: pip
    directory: "/"
    target-branch: develop
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    labels: [dependencies]

  - package-ecosystem: npm
    # The pinned @cruxgarden/plasma-ui version the demo resolves.
    directory: "/plasma_ui_demo/reflex.lock"
    target-branch: develop
    schedule:
      interval: monthly
    open-pull-requests-limit: 3
    labels: [dependencies, frontend]
